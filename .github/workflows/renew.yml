name: Renew PythonAnywhere App

on:
  schedule:
    - cron: '0 0 15 * *'  # Runs at 00:00 UTC on the 15th of every month (middle of the month)
  workflow_dispatch:      # Allows manual trigger via the GitHub UI

jobs:
  renew:
    name: Renew PythonAnywhere Web Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run renewal script
        run: python helper/renew_app.py
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
